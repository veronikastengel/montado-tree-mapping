<!DOCTYPE html>
<html>
<head>
    <title>Montado Tree Mapping</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #title {
            position: absolute;
            top: 10px; left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="title"><b>Montado Tree Mapping — Test</b><br>Central Portugal</div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Centre on your study area — adjust these coordinates
        // These are approximate for Alentejo near Spanish border
        var map = L.map('map').setView([39.5, -7.0], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Test marker at study area centre
        L.marker([39.5, -7.0])
            .addTo(map)
            .bindPopup('Study area — crowns will appear here')
            .openPopup();
    </script>
</body>
</html>
